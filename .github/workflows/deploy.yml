# Builds the app and publishes it on GitHub Pages. Based on https://vite.dev/guide/static-deploy#github-pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying again from the Actions tab
  workflow_dispatch:

# NOTE: deploy-pages needs pages to publish and id-token to prove the deployment comes from this workflow
permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: One deployment at a time. A newer run waits for the one in progress instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back to the repository
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # NOTE: The site is served under the repository name (/holydays-calendar/), so asset URLs need that base.
      # Pages reports it, so a rename or a custom domain needs no change here
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="$BASE_PATH/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
